<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5;url=index.html">
    <title>Thank You - Fine Cane Works</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .thank-you-page {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: var(--color-white);
            padding: var(--spacing-xxxl);
        }
        .thank-you-icon {
            font-size: 4rem;
            margin-bottom: var(--spacing-lg);
        }
        .thank-you-title {
            font-size: var(--font-size-xxxl);
            color: var(--color-primary);
            margin-bottom: var(--spacing-lg);
        }
        .thank-you-message {
            font-size: var(--font-size-lg);
            color: var(--color-text-medium);
            max-width: 600px;
            margin-bottom: var(--spacing-xl);
        }
        .thank-you-btn {
            padding: var(--spacing-md) var(--spacing-xxl);
            font-size: var(--font-size-base);
            font-weight: 600;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: transform var(--transition-speed) var(--transition-easing);
        }
        .thank-you-btn:hover { transform: translateY(-2px); }
        .auto-redirect {
            font-size: var(--font-size-sm);
            color: var(--color-text-medium);
            margin-top: var(--spacing-lg);
        }
    </style>

<body>
    <a href="index.html" class="skip-link">Skip to main content</a>

    <main>
        <div class="thank-you-page">
            <div class="thank-you-icon">✂</div>
            <h1 class="thank-you-title">Thank You for Your Message!</h1>
            <p class="thank-you-message">
                Your inquiry has been sent successfully. We will contact you shortly regarding your request for Fine Cane Works products.
            </p>
            <a href="index.html" class="btn btn-primary thank-you-btn">Return to Homepage</a>
            <p class="auto-redirect">Redirecting back to homepage in 5 seconds...</p>
        </div>
    </main>

</html>
